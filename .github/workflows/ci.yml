name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.4.2
          run_install: false
      - name: Instalar dependencias reproducibles
        run: pnpm install --frozen-lockfile
      - name: Verificar incremento de versión
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm check:release "$BASE_SHA"
      - name: Probar configuración y SemVer
        run: pnpm test:config
      - name: Tests de aplicación
        run: pnpm test --watch=false
      - name: Tests de baja y límites del servidor
        run: pnpm test:server
      - name: Build de Preview
        env:
          VERCEL_ENV: preview
        run: pnpm build
      - name: Instalar navegador de prueba
        run: pnpm exec playwright install --with-deps chromium
      - name: Verificar PWA y actualización entre versiones
        run: pnpm test:pwa
      - name: Verificar editor, navegación y menús
        run: pnpm test:editor
      - name: Build de Production
        env:
          VERCEL_ENV: production
        run: pnpm build
      - name: Sin secretos en el bundle
        run: '! grep -rIE "sb_secret_|SERVICE_ROLE" dist/outify/browser'

  security:
    name: Seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.117.0
      - name: Base local con las migraciones del repo
        run: supabase db start
      - name: Tests de RLS, catálogo y aislamiento
        run: supabase test db supabase/tests/security
