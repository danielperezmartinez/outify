name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # En main no se cancela: un push de solo docs/ no debe interrumpir el CI de una fusión de código.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Cambios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detectar cambios fuera de docs/
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        # Solo la bóveda (docs/) no sube versión ni necesita build ni tests de base de datos.
        # Si el diff no puede calcularse, se trata como código.
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- . ':(exclude)docs' 2>/dev/null; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verificar
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.4.2
          run_install: false
      - name: Instalar dependencias reproducibles
        run: pnpm install --frozen-lockfile
      - name: Verificar incremento de versión
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm check:release "$BASE_SHA"
      - name: Probar configuración y SemVer
        run: pnpm test:config
      - name: Tests de aplicación
        run: pnpm test --watch=false
      - name: Tests de baja y límites del servidor
        run: pnpm test:server
      - name: Build de Preview
        env:
          VERCEL_ENV: preview
        run: pnpm build
      - name: Instalar navegador de prueba
        run: pnpm exec playwright install --with-deps chromium
      - name: Verificar PWA y actualización entre versiones
        run: pnpm test:pwa
      - name: Verificar editor, navegación y menús
        run: pnpm test:editor
      - name: Build de Production
        env:
          VERCEL_ENV: production
        run: pnpm build
      - name: Sin secretos en el bundle
        run: '! grep -rIE "sb_secret_|SERVICE_ROLE" dist/outify/browser'

  security:
    name: Seguridad
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.117.0
      - name: Base local con las migraciones del repo
        run: supabase db start
      - name: Tests de RLS, catálogo y aislamiento
        run: supabase test db supabase/tests/security

  leaks:
    name: Fugas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (historial, mensajes, rama y PR)
        env:
          GITLEAKS_VERSION: 8.30.1
          # El texto de la PR va por variable de entorno, nunca interpolado en el script.
          PR_TEXTO: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archivo"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $archivo\$" | sha256sum -c -
          tar -xzf "$archivo" gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml
          { git log --format=%B; printf '%s\n%s\n' "$RAMA" "$PR_TEXTO"; } | ./gitleaks stdin --redact --no-banner --config .gitleaks.toml
